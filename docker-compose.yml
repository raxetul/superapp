# SuperApp — internal infrastructure stack (local dev).
# Provisions PostgreSQL, Redis, Kafka, Prometheus, Grafana as superapp-* containers
# on a shared `superapp` network. App services (backend/frontend) join the same
# network and reach these by service name. Values default so `docker compose config`
# works without a .env; copy .env.example → .env to override.
name: superapp

networks:
  superapp:
    name: superapp
    driver: bridge

volumes:
  superapp-pgdata:
  superapp-redisdata:
  superapp-kafkadata:
  superapp-grafanadata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: superapp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superapp}
      POSTGRES_DB: ${POSTGRES_DB:-superapp}
    ports:
      - "${SUPERAPP_BACKEND_DB_PORT:-5432}:5432"
    volumes:
      - superapp-pgdata:/var/lib/postgresql/data
    networks: [superapp]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: superapp-redis
    ports:
      - "${SUPERAPP_BACKEND_REDIS_PORT:-6379}:6379"
    volumes:
      - superapp-redisdata:/data
    networks: [superapp]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    container_name: superapp-kafka
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@superapp-kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://superapp-kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${SUPERAPP_BACKEND_KAFKA_PORT:-9092}:9092"
    volumes:
      - superapp-kafkadata:/bitnami/kafka
    networks: [superapp]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: superapp-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "${SUPERAPP_BACKEND_PROM_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [superapp]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: superapp-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${SUPERAPP_BACKEND_GRAFANA_PORT:-3001}:3000"
    volumes:
      - superapp-grafanadata:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [superapp]
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
