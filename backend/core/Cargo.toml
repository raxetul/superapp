[workspace]

[package]
name = "core"
version = "0.1.0"
edition = "2021"
# Dev toolchain is rustc 1.85 (source tarball, no rustup). Declaring the MSRV
# makes the resolver reject deps that need a newer compiler (see the P4 pins
# for cedar-policy 4.0.1, the last release supporting 1.85).
rust-version = "1.85"
publish = false
default-run = "core-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# NOT "core": a crate named `core` shadows the std `core` crate in the extern
# prelude of the integration-test crate, breaking macro-expanded `core::…`
# paths (e.g. from `#[tokio::test]`). Use a distinct, std-safe name.
name = "superapp_core"
path = "src/lib.rs"

[workspace.dependencies]
loco-rs = { version = "0.16" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "1.1", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
include_dir = { version = "0.7" }

# --- P4: Authentication, SSO & policy-based AuthZ ---
# OIDC RP (Rauthy), JWT/JWKS validation, Redis refresh store, Cedar authz.
jsonwebtoken = { version = "9" }
redis = { version = "0.31", default-features = false, features = [
  "tokio-comp",
  "connection-manager",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
openidconnect = { version = "3" }
# 4.0.1 is the last cedar-policy release with MSRV <= 1.85 (4.1+ needs 1.89).
cedar-policy = { version = "=4.0.1" }
rand = { version = "0.8" }
base64 = { version = "0.22" }
sha2 = { version = "0.10" }
thiserror = { version = "1" }

[[bin]]
name = "core-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
