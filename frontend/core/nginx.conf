# TR-10-004 — serve the built SPA; unknown paths fall back to index.html so
# client-side routes (react-router-dom, TR-07-*) resolve on a hard refresh.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html itself must not be cached
    # so a new deploy is picked up without a cache-bust.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
